name: violin-humidity

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: humidity

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch weather, log, alert
        run: python check.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Commit data
        run: |
          git config user.name "humidity-bot"
          git config user.email "humidity-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "data: $(date -u +%FT%TZ)"
          git push
